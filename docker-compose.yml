services:
  db:
    image: postgres:16-alpine
    container_name: ecell_db
    restart: always
    environment:
      POSTGRES_USER: ecell_user
      POSTGRES_PASSWORD: ecell_secret
      POSTGRES_DB: ecell_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecell_user -d ecell_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecell_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://ecell_user:ecell_secret@db:5432/ecell_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecell_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
